name: (임시) 배포 게이트 실러너 관측

# 이 파일은 **일시적**이다. 다음 커밋에서 삭제된다.
#
# 목적: build-dashboard.yml 의 build 잡에 새로 들어간 세 가지 —
#   ① actions/checkout 의 lfs: true (비공개 data 저장소, DATA_REPO_TOKEN)
#   ② git lfs pull (비-LFS 저장소에서 no-op 이어야 함)
#   ③ "PK 로 시작하는지" 워크북 확인
# 그리고 ④ pipeline/check_output.py 배포 게이트를
# **실제 GitHub 러너에서 실데이터로** 한 번 돌려 보는 것.
#
# Pages 관련 스텝(configure-pages / upload-pages-artifact / deploy-pages)은
# 일부러 전부 뺐다 — 프로덕션 Pages 를 건드리지 않기 위해서다.
# permissions 도 contents: read 만 준다.

on:
  push:
    branches: ["claude/panel-workflow-efficiency-pt5ggb"]
    paths:
      - ".github/workflows/_audit-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GATE_MAX_WARNINGS: "20"
      GATE_MIN_SERIES: "100"
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v5

      - name: Checkout private data repo
        uses: actions/checkout@v5
        with:
          repository: hyeongjunkim0934/data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: source-data
          lfs: true

      - name: Pull LFS objects (LFS 가 아니면 no-op)
        working-directory: source-data
        run: git lfs pull

      - name: Verify data files are real workbooks (not LFS pointers)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 2 "$f")" != "PK" ]; then
              echo "::error::$f 가 실제 워크북이 아닙니다 (LFS 포인터일 가능성) — checkout 의 lfs:true 와 DATA_REPO_TOKEN 권한을 확인하세요"
              bad=1
            fi
          done < <(find source-data -type f \( -iname '*.xlsx' -o -iname '*.xlsm' \) ! -name '~$*' -print0)
          [ "$bad" -eq 0 ] || exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build dashboard data
        run: |
          mkdir -p _site
          cp -r dashboard/. _site/
          python pipeline/process.py --data-dir source-data --out _site/data

      - name: Deploy gate — JSON 계약 검사
        run: |
          python pipeline/check_output.py \
            --out _site/data \
            --max-warnings "$GATE_MAX_WARNINGS" \
            --min-series "$GATE_MIN_SERIES" \
            --dashboard dashboard/app.js
