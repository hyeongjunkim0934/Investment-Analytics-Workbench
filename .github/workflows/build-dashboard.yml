name: Build & deploy dashboard

# 트리거:
#   1) repository_dispatch(data-updated) — 비공개 data 저장소에 엑셀이 푸시될 때
#   2) workflow_dispatch — Actions 탭에서 수동 실행
#   3) push — 이 저장소의 파이프라인/대시보드 코드가 바뀔 때
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   DATA_REPO_TOKEN — hyeongjunkim0934/data 저장소 Contents: Read 권한이 있는
#   Fine-grained PAT (비공개 데이터 체크아웃용)
#
# 필요한 설정: Settings → Pages → Source = "GitHub Actions"
#
# 잡 순서: test → build(+배포 게이트) → deploy.
#   test  — 합성 픽스처로 파이프라인 계약을 검사한다 (비공개 데이터 불필요).
#   build — 실데이터로 JSON 을 만들고, **배포 직전에** check_output.py 로 계약을 확인한다.
#           process.py 는 risk/hedge 실패를 try/except 로 삼키고 exit 0 으로 끝나므로,
#           이 게이트가 없으면 섹션이 빠진 대시보드가 초록불로 배포된다.
#   deploy— build 가 성공한 경우에만 돈다.

on:
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
  push:
    # 현재 기본 브랜치는 아직 세션명이다. `main` 으로 rename 하기 전에 이 줄에서
    # 세션명을 빼면 기본 브랜치 push 가 트리거되지 않는 잠복 상태가 된다 —
    # 세 이름을 모두 두면 rename 전후 어느 쪽에서도 트리거가 끊기지 않는다.
    # rename 을 마친 뒤에 세션명만 지울 것 (docs/SETUP.md「참고 — 브랜치 관련」).
    branches: [main, master, "claude/data-repo-dashboard-automation-cj8y59"]
    paths:
      - "pipeline/**"
      - "dashboard/**"
      - "tests/**"
      - ".github/workflows/build-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 프로덕션 배포는 취소하지 않고 대기시킨다 — 배포 도중 취소되면
# 다음 실행이 deployment 충돌로 실패할 수 있다 (GitHub Pages 공식 권장값).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 배포 게이트 임계값. **등호가 아니라 상한/바닥**이다 —
  # 경고 수와 시리즈 수는 data 저장소의 엑셀에서 오는 수라 갱신하면 정상적으로 바뀐다.
  # 현재 기준선: 경고 7건 / 시리즈 444개 (정본은 Data 저장소 CLAUDE.md).
  # 급감·급증만 신호로 보기 위해 넉넉히 잡는다.
  GATE_MAX_WARNINGS: "20"
  GATE_MIN_SERIES: "100"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run tests (합성 픽스처 — 비공개 데이터 불필요)
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v5

      - name: Checkout private data repo
        uses: actions/checkout@v5
        with:
          repository: hyeongjunkim0934/data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref || '' }}
          path: source-data
          # LFS 대비(현재는 no-op). data 저장소는 **아직 LFS 가 아니므로** 이 옵션은
          # 지금 아무 일도 하지 않는다. 그럼에도 먼저 넣어 두는 이유: actions/checkout 의
          # lfs 기본값은 false 이고, data 가 LFS 로 전환된 순간부터 이 옵션이 없으면
          # 워크북 대신 130바이트 포인터 텍스트가 내려와 openpyxl 이
          # zipfile.BadZipFile 로 죽는다. 소비자(여기)를 **먼저** 준비시켜 두면
          # data 쪽 전환을 어느 시점에 하든 체인이 끊기지 않는다.
          lfs: true

      # 비-LFS 저장소에서는 exit 0 인 no-op 이다(실측 확인).
      - name: Pull LFS objects (LFS 가 아니면 no-op)
        working-directory: source-data
        run: git lfs pull

      # xlsx 는 ZIP 이라 반드시 "PK" 로 시작한다. 이 검사는 LFS 여부와 무관하게
      # 유용하다 — 포인터 텍스트("ve…"), 잘린 업로드, HTML 오류 페이지가 엑셀 이름으로
      # 올라온 경우를 전부 `zipfile.BadZipFile` 대신 명시적 오류로 바꿔 준다.
      - name: Verify data files are real workbooks (not LFS pointers)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 2 "$f")" != "PK" ]; then
              echo "::error::$f 가 실제 워크북이 아닙니다 (LFS 포인터일 가능성) — checkout 의 lfs:true 와 DATA_REPO_TOKEN 권한을 확인하세요"
              bad=1
            fi
          done < <(find source-data -type f \( -iname '*.xlsx' -o -iname '*.xlsm' \) ! -name '~$*' -print0)
          [ "$bad" -eq 0 ] || exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build dashboard data
        run: |
          mkdir -p _site
          cp -r dashboard/. _site/
          python pipeline/process.py --data-dir source-data --out _site/data

      # ── 배포 게이트 ────────────────────────────────────────────────────────
      # 여기서 실패하면 artifact 를 올리지도, deploy 잡을 시작하지도 않는다.
      - name: Deploy gate — JSON 계약 검사
        run: |
          python pipeline/check_output.py \
            --out _site/data \
            --max-warnings "$GATE_MAX_WARNINGS" \
            --min-series "$GATE_MIN_SERIES" \
            --dashboard dashboard/app.js

      # ── 관측성 ────────────────────────────────────────────────────────────
      # 빌드 요약을 Actions 실행 화면 상단에 표로 띄운다. 게이트가 막아 실패한
      # 실행에서도 "무엇이 몇 개였는지"를 로그를 뒤지지 않고 보기 위해
      # if: always() 로 둔다. meta.json 이 없으면(=파이프라인이 exit 1) 그 사실만 적는다.
      # 여기 실려 나가는 값은 시리즈 **개수와 이름**뿐이며 관측치 값은 넣지 않는다
      # (시리즈 이름은 이미 공개 catalog.json 에 실린다).
      # 이 단계만 `python3` 를 쓰는 이유: if: always() 라서 "Set up Python" 이 죽은
      # 실행에서도 돌아야 하는데, 그 상황에서 bare `python` 은 PATH 에 없을 수 있다.
      # (게이트가 막은 정상 실패 경로에서는 어느 쪽이든 동작한다.)
      - name: Build summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path("_site/data/meta.json")
          if not p.exists():
              print("## 빌드 요약\n\n`_site/data/meta.json` 이 없습니다 — 파이프라인이 JSON 을 쓰기 전에 실패했습니다.")
              raise SystemExit(0)
          m = json.loads(p.read_text(encoding="utf-8"))
          n_json = len(list(p.parent.glob("*.json")))
          print("## 빌드 요약\n")
          print("| 항목 | 값 |")
          print("|---|---|")
          print(f"| 빌드 시각(UTC) | {m.get('built_at_utc','?')} |")
          print(f"| 최종 관측일 | {m.get('last_observation','?')} |")
          print(f"| 시리즈 수 | {m.get('series_count','?')} |")
          print(f"| JSON 파일 수 | {n_json} (계약 14) |")
          print(f"| 경고 | {len(m.get('warnings', []))}건 (상한 {os.environ.get('GATE_MAX_WARNINGS','?')}) |")
          files = m.get("files") or []          # 리스트[dict] 이다 — dict 아님
          if files:
              print("\n### 파일별 파싱 결과\n")
              print("| 파일 | 종류 | 시리즈 |")
              print("|---|---|---|")
              for f in files:
                  print(f"| `{f.get('file','?')}` | {f.get('kind','?')} | {f.get('series','?')} |")
          w = m.get("warnings") or []
          if w:
              print("\n<details><summary>경고 %d건</summary>\n" % len(w))
              for line in w:
                  print(f"- `{line}`")
              print("\n</details>")
          PY

      # 이 단계에서 "Get Pages site failed … Not Found"로 실패하면
      # Settings → Pages → Source가 "GitHub Actions"로 설정되지 않은 것이다.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
