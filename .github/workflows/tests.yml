name: Tests

# 비공개 데이터가 필요 없는 검사만 돈다 — 픽스처는 tests/synth.py 가 만드는
# 합성 워크북이다. 그래서 PR(dependabot 포함)에서도 그대로 돌릴 수 있다.
#
# 배포 경로의 테스트는 build-dashboard.yml 의 test 잡이 따로 돈다
# (build 가 needs: test 로 걸려 있어, 테스트가 깨지면 배포가 시작되지 않는다).

on:
  pull_request:
  push:
    branches-ignore:
      - "gh-pages"
    paths:
      - "pipeline/**"
      - "tests/**"
      # dashboard 전체 — test_contract.py 가 app.js 뿐 아니라 index.html(섹션 목록)과
      # style.css([hidden] 규칙)도 읽는다. app.js 만 걸어 두면 나머지 두 파일을 고친
      # 커밋이 검사 없이 지나간다.
      - "dashboard/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest
